global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/alerts.yml'
  - '/etc/prometheus/rules/blackbox_alerts.yml'
  - '/etc/prometheus/rules/veeam_alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'blackbox-servidores-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['192.168.1.69:445']
        labels: { nome: "Srv Arquivos", servico: "Armazenamento de Arquivos" }
      - targets: ['192.168.1.90:445']
        labels: { nome: "Srv Impressao", servico: "Digitalizacao de Documentos" }
      - targets: ['192.168.1.2:445']
        labels: { nome: "Srv Proxy Veeam", servico: "Processamento Backup" }
      - targets: ['192.168.1.89:4445']
        labels: { nome: "Srv SysAdmin", servico: "Gerenciamento InControl e Robo SharePoint" }
      - targets: ['192.168.1.66:22']
        labels: { nome: "Srv Monitoramento", servico: "E-CAM e Sistemas de Monitoramento" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-servidor-backup-principal'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets: ['192.168.1.51']
        labels: { nome: "Srv Backup Principal", servico: "Armazenamento de Backup e Sentinela Principal" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-access-points'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets: ['192.168.1.22']
        labels: { nome: "COMPRAS/FROTAS" }
      - targets: ['192.168.1.16']
        labels: { nome: "ADMINISTRATIVO GERAL" }
      - targets: ['192.168.1.4']
        labels: { nome: "USW-24-PoE" }
      - targets: ['192.168.1.31']
        labels: { nome: "TI" }
      - targets: ['192.168.1.12']
        labels: { nome: "RECURSOS HUMANOS" }
      - targets: ['192.168.1.18']
        labels: { nome: "JURIDICO/COMPLIANCE" }
      - targets: ['192.168.1.13']
        labels: { nome: "ALMOXARIFADO/PLANEJAMENTO" }
      - targets: ['192.168.1.191']
        labels: { nome: "RECEPCAO" }
      - targets: ['192.168.1.14']
        labels: { nome: "DIRETORIA" }
      - targets: ['192.168.1.17']
        labels: { nome: "DEPARTAMENTO PESSOAL" }
      - targets: ['192.168.1.30']
        labels: { nome: "SESMT" }
      - targets: ['192.168.1.15']
        labels: { nome: "GERENCIA" }
      - targets: ['192.168.1.28']
        labels: { nome: "AUDITORIO" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-unifi-controller'
    metrics_path: /probe
    params:
      module: [http_2xx_insecure]
    static_configs:
      - targets: ['https://192.168.1.128']
        labels:
          nome: "Gen2-ELCOP-SEDE (Controladora UniFi)"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'blackbox-impressoras'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets: ['192.168.1.41']
        labels: { nome: "Impressora Financeiro/Fiscal" }
      - targets: ['192.168.1.20']
        labels: { nome: "Impressora Hall" }
      - targets: ['192.168.1.24']
        labels: { nome: "Impressora Frotas" }
      - targets: ['192.168.1.23']
        labels: { nome: "Impressora DP" }
      - targets: ['192.168.1.25']
        labels: { nome: "Impressora SESMT" }
      - targets: ['192.168.1.180']
        labels: { nome: "Impressora RH" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-impressoras-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['192.168.1.41:9100']
        labels: { nome: "Impressora Financeiro/Fiscal" }
      - targets: ['192.168.1.20:9100']
        labels: { nome: "Impressora Hall" }
      - targets: ['192.168.1.24:9100']
        labels: { nome: "Impressora Frotas" }
      - targets: ['192.168.1.23:9100']
        labels: { nome: "Impressora DP" }
      - targets: ['192.168.1.25:9100']
        labels: { nome: "Impressora SESMT" }
      - targets: ['192.168.1.180:9100']
        labels: { nome: "Impressora RH" }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
